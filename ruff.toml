# Shared ruff config for every Python component in the repo.
# Keep the ruff version in sync with .pre-commit-config.yaml and the justfile.
line-length = 100
target-version = "py311"
extend-exclude = [".claude", "docker"]

# First-party package roots, so import sorting groups local imports correctly.
src = ["mcp/*", "webapp", "pipeline/src"]

[lint]
select = ["E", "F", "I", "UP"]
ignore = [
    # The formatter owns line length; what's left over is long strings and comments.
    "E501",
    # `class X(str, Enum)` -> StrEnum changes what str() returns; not a safe swap.
    "UP042",
]

[lint.per-file-ignores]
# These modules extend sys.path before importing pipeline/webapp code.
"webapp/src/*.py" = ["E402"]
"**/tests/conftest.py" = ["E402"]
