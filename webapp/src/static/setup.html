<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAA — First-time Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    html, body { overflow: auto; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-box   { width: 400px; border: 1px solid var(--border); padding: 40px; background: var(--surface); }
    .auth-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .auth-title { font-size: 10px; letter-spacing: 3px; color: var(--text3); }
    .auth-sub   { font-size: 10px; color: var(--text3); margin-bottom: 32px; line-height: 1.6; }
    .field      { margin-bottom: 18px; }
    .field label { display: block; font-size: 9px; letter-spacing: 2px; color: var(--text3); margin-bottom: 6px; }
    .field input { width: 100%; }
    .err-msg    { margin-top: 14px; font-size: 10px; color: var(--err); display: none; }
    .hint       { font-size: 9px; color: var(--text3); margin-top: 5px; }
  </style>
</head>
<body>
  <div class="auth-box">
    <div class="auth-brand">
      <span style="color:var(--accent);font-size:13px">◆</span>
      <span style="font-size:11px;letter-spacing:1.5px;color:#cbcbcb">NAA</span>
      <span class="auth-title">/ FIRST-TIME SETUP</span>
    </div>
    <p class="auth-sub">Set a password to protect this control panel. You can configure service credentials from the dashboard after signing in.</p>

    <form method="POST" action="/setup">
      <div class="field">
        <label>PASSWORD</label>
        <input class="mono-input" type="password" name="password" autofocus />
        <div class="hint">Minimum 8 characters.</div>
      </div>
      <div class="field">
        <label>CONFIRM PASSWORD</label>
        <input class="mono-input" type="password" name="confirm" />
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%">CREATE PASSWORD →</button>
      <div class="err-msg" id="err-short">Password must be at least 8 characters.</div>
      <div class="err-msg" id="err-mismatch">Passwords do not match.</div>
    </form>
  </div>

  <script>
    const p = new URLSearchParams(location.search);
    if (p.get('error') === 'short')    document.getElementById('err-short').style.display    = 'block';
    if (p.get('error') === 'mismatch') document.getElementById('err-mismatch').style.display = 'block';
  </script>
</body>
</html>
