[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oracle-mcp"
version = "0.1.0"
description = "Read-only MCP server for Oracle 11g schema, source and queries"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "oracledb>=2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
oracle-mcp = "oracle_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["oracle_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
