[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-graph-mcp"
version = "0.1.0"
description = "MCP server exposing the Neo4j document knowledge graph"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "neo4j>=5.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
knowledge-graph-mcp = "knowledge_graph_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_graph_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
