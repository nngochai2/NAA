[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-mcp"
version = "0.1.0"
description = "MCP server for GitLab and GitHub — issues and pull requests"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "python-gitlab>=4.0.0",
    "PyGithub>=2.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.40.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
git-mcp = "git_mcp.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP"]
