[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ado-mcp"
version = "0.1.0"
description = "MCP server for Azure DevOps Server (on-prem) work items"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
    "httpx-ntlm>=1.4.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.36.0",
    "uvicorn>=0.29.0",
    "anyio>=4.3.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ado-mcp = "ado_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["ado_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
