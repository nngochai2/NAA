id: codegraph
label: "Code Graph MCP"
cmd: ["python", "-m", "codegraph_mcp"]
host: "127.0.0.1"
port: 8001
env_file: .env

credentials:
  - key: NEO4J_URI
    label: "Neo4j URI"
    secret: false
    placeholder: "bolt://localhost:7688"
  - key: NEO4J_USER
    label: "Neo4j User"
    secret: false
    placeholder: "neo4j"
  - key: NEO4J_PASSWORD
    label: "Neo4j Password"
    secret: true
    placeholder: ""
